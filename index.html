<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>

    <div class="page-header">
        <br>
        <h1 style="margin-left: 35%;">Kalkulator budrzetu domowego</h1>
    </div>

    <h2 style="margin-left: 2%;">Dodaj</h1>
        <br>

        <form>
            <div class="row mx-2">
                <div class="col-6">
                    <div class="input-group">
                        <input type="text" class="form-control" name="opis" placeholder="Opis" id="opis">
                    </div>
                </div>

                <div class="col-6">
                    <div class="input-group">
                        <input type="number" class="form-control" name="ilosc" placeholder="Kwota" id="ilosc">
                    </div>
                </div>

                <div class="col-6" style="margin-top: 1%;">
                    <div class="input-group">

                        <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg example" id="typoperacji"
                            id="typ operacji">
                            <option value="1" selected>Dochód</option>
                            <option value="2">Wydatek</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-primary" style="margin-left: 1%; width: 10%;" id="dodaj">Dodaj</button>
        </form>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
        <script src="main.js"></script>
</body>

</html>
